    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-yellow: #fbbf24;
            --primary-green: #10b981;
            --primary-red: #ef4444;
            --bg-deep: #0f172a;
            --neon-blue: #3b82f6;
            --neon-cyan: #06b6d4;
        }

        *::-webkit-scrollbar { width: 6px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            overflow-x: hidden;
        }

        /* NEON SIDEBAR TEXT */
        .neon-sidebar-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.6), 0 0 20px rgba(34, 211, 238, 0.3);
        }

        /* AUTO HIDE HEADER LOGIC */
        .header-top-hide { 
            max-height: 0; 
            opacity: 0; 
            padding-top: 0; 
            padding-bottom: 0; 
            margin-bottom: 0;
            overflow: hidden;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .header-top-show { 
            max-height: 100px; 
            opacity: 1; 
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* HEADER BASIC */
        .simple-basic-header {
            background-color: #2563eb !important;
            border-bottom: 4px solid #1d4ed8;
        }
        
        /* HEADER PRO */
        .epic-dark-blue-header {
            background: linear-gradient(to bottom, #020617 0%, #0c1b3d 100%);
            border-bottom: 2px solid var(--neon-blue);
            position: relative;
        }

        /* LOGO ANIMATIONS */
        .logo-basic { width: 42px; height: 42px; object-fit: contain; }
        .logo-pro { 
            width: 48px; height: 48px; object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.8));
            animation: logo-spin-slow 20s linear infinite;
        }
        @keyframes logo-spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cyber-grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(to right, rgba(59, 130, 246, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .header-scanning-light {
            position: absolute;
            top: 0; left: -100%; width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.15), transparent);
            animation: scan 8s linear infinite;
            pointer-events: none;
        }
        @keyframes scan { 0% { left: -100%; } 100% { left: 200%; } }

        .pro-title-wrapper { position: relative; display: inline-block; width: 100%; }
        .pro-digital-line {
            position: absolute; height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            left: 0; right: 0; opacity: 0.6;
        }
        .pro-line-top { top: -4px; }
        .pro-line-bottom { bottom: -4px; }

        .Museum-Text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }

        /* INPUT FUTURISTIC */
        .input-futuristic {
            background-color: #ffffff !important;
            color: #1e293b !important;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            transition: all 0.3s;
        }
        .input-futuristic:focus {
            border-color: #2563eb;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.1);
        }

        /* INVENTORY CUSTOM BORDERS */
        .border-nature { border: 6px double #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .border-wood { border: 8px solid #78350f; border-image: linear-gradient(to bottom, #78350f, #451a03) 1; }
        .border-water { border: 6px solid #3b82f6; border-radius: 4rem; animation: water-pulse 3s ease-in-out infinite; }
        @keyframes water-pulse { 0%, 100% { border-color: #3b82f6; box-shadow: 0 0 5px #3b82f6; } 50% { border-color: #60a5fa; box-shadow: 0 0 20px #60a5fa; } }
        .border-neon-pulse { border: 4px solid #06b6d4; animation: neon-blink 1.5s infinite; }
        @keyframes neon-blink { 0%, 100% { opacity: 1; box-shadow: 0 0 20px #06b6d4; } 50% { opacity: 0.7; box-shadow: 0 0 5px #06b6d4; } }
        .border-chroma { border: 6px solid transparent; border-image: linear-gradient(45deg, #f43f5e, #3b82f6, #10b981, #eab308) 1; animation: chroma-shift 4s linear infinite; }
        @keyframes chroma-shift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .border-prism { border: 4px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.5), inset 0 0 15px rgba(255,255,255,0.3); background-clip: padding-box; }
        .border-data { border: 4px solid #10b981; position: relative; }
        .border-data::after { content: ''; position: absolute; inset: -4px; border: 2px solid #34d399; opacity: 0.5; animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        .border-lava { border: 6px solid #f97316; box-shadow: 0 0 25px #ea580c; }
        .border-diamond { border: 4px solid #f8fafc; box-shadow: 0 0 15px #e2e8f0, inset 0 0 10px #fff; }
        .border-glow-neon { border: 4px solid #22d3ee; box-shadow: 0 0 15px #22d3ee, inset 0 0 10px #22d3ee; }
        .border-cyber-circuit { border: 4px solid #3b82f6; clip-path: polygon(0 10%, 10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%); }

        /* ADVANCED DIGITAL BORDERS */
        .border-glitch-binary {
            border: 4px solid #10b981;
            position: relative;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .border-glitch-binary::before {
            content: '101010101010';
            position: absolute; top: -12px; left: 10px; background: #000; color: #10b981; font-family: monospace; font-size: 8px; padding: 0 4px; animation: glitch-text-fast 0.5s infinite;
        }
        @keyframes glitch-text-fast { 0% { content: '101010'; opacity: 1; } 50% { content: '010101'; opacity: 0.5; } 100% { content: '111000'; opacity: 1; } }

        .border-quantum {
            border: 4px solid transparent;
            background: linear-gradient(#0f172a, #0f172a) padding-box, linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899) border-box;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            animation: quantum-border 3s ease infinite;
        }
        @keyframes quantum-border { 0%, 100% { filter: hue-rotate(0deg) brightness(1); } 50% { filter: hue-rotate(90deg) brightness(1.2); } }

        .border-cyber-hex {
            border: 3px solid #06b6d4;
            clip-path: polygon(5% 0%, 95% 0%, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0% 95%, 0% 5%);
            box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.5);
        }

        .border-neural-mesh {
            border: 2px solid rgba(59, 130, 246, 0.5);
            background-image: radial-gradient(circle at 2px 2px, rgba(59, 130, 246, 0.2) 1px, transparent 0);
            background-size: 10px 10px;
        }

        /* INVENTORY CUSTOM FONTS */
        .font-comic { font-family: 'Fredoka', sans-serif !important; }
        .font-elegant { font-family: 'Space Grotesk', sans-serif !important; }
        .font-marker { font-family: 'Permanent Marker', cursive !important; }
        .font-arcade { font-family: 'Press Start 2P', cursive !important; font-size: 0.7em !important; }
        .font-heavy { font-family: 'Bungee', cursive !important; }
        .font-stencil { font-family: 'JetBrains Mono', monospace !important; letter-spacing: 0.1em; }
        .font-retro { font-family: 'JetBrains Mono', monospace !important; }
        .font-vapor { font-family: 'Space Grotesk', sans-serif !important; font-style: italic; letter-spacing: 0.2em; }
        .font-scifi { font-family: 'JetBrains Mono', monospace !important; font-weight: 800; }
        .font-binary { font-family: 'JetBrains Mono', monospace !important; opacity: 0.9; }

        /* ANIMATIONS */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .effect-float { animation: float 3s ease-in-out infinite; }
        @keyframes jiggle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
        .effect-wiggle { animation: jiggle 0.3s ease-in-out infinite; }
        @keyframes glitch-sharp {
            0% { clip: rect(44px, 450px, 56px, 0); }
            5% { clip: rect(62px, 450px, 12px, 0); }
            10% { clip: rect(34px, 450px, 86px, 0); }
            15% { clip: rect(10px, 450px, 32px, 0); }
            20% { clip: rect(54px, 450px, 4px, 0); }
            100% { clip: rect(44px, 450px, 56px, 0); }
        }
        .effect-glitch-text { animation: glitch-sharp 0.3s infinite; text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }

        @keyframes loading-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .animate-loading { animation: loading-bar 2s ease-in-out infinite; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .scrolling-text { animation: scroll-marquee 20s linear infinite; display: inline-block; }
        @keyframes scroll-marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* SIDEBAR TRANSITION */
        .sidebar-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* JOYFUL SHADOW HELPER */
        .joyful-shadow {
            box-shadow: 0 8px 0 0 rgba(0, 0, 0, 0.1);
        }
        .joyful-shadow:active {
            box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.1);
            transform: translateY(4px);
        }
    </style>

</head>
